<!DOCTYPE html>
<html lang="ko" data-reads-theme="lime-v4">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE_ESCAPED}} — 7Peaks Reads</title>
  <script id="reads-theme-init">{{READS_THEME_INIT_JS}}</script>
  <style id="reads-article-theme">{{READS_THEME_CSS}}</style>
</head>
<body data-reads-view="article" data-reads-theme="lime-v4">
  <nav id="site-nav" aria-label="글 탐색">
    <a class="nav-home" href="https://sevenpeaksone.github.io/reads/">{{READS_WORDMARK_SVG}}<span>Reads</span></a>
    <span class="nav-spacer"></span>

  </nav>
  <main class="wrap">
    <div class="meta"><span class="badge">{{CATEGORY_ESCAPED}}</span> <time class="date" datetime="{{DATE_ISO}}">{{DATE_ISO}}</time></div>
    <h1>{{TITLE_ESCAPED}}</h1>
    {{ARTICLE_BODY_HTML}}

  <script id="reads-theme-script">{{READS_THEME_JS}}</script>
